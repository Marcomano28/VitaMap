# =====================================================================
# VitaMap — Fase 1 (piloto 3 usuarios en VPS CCX13)
# Cuatro servicios: caddy (TLS + reverse proxy), web (Next.js + QMD),
# llm (llama.cpp server), backup (restic cron a Backblaze B2).
# =====================================================================

name: vitamap

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN required}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@vitamap.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vitamap
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    image: vitamap/web:latest
    restart: unless-stopped
    environment:
      # Por defecto apunta al servicio LLM local. Durante el piloto puede
      # apuntar a una API externa UE (ADR-014): definir LLM_BASE_URL,
      # LLM_PROVIDER=external y LLM_API_KEY en infra/.env, y desactivar
      # el perfil local-llm (COMPOSE_PROFILES vacío).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-qwen3-4b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed-for-local}
      QMD_EMBED_MODEL: ${QMD_EMBED_MODEL:-hf:Qwen/Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf}
      DATA_ROOT: /data
      KB_INDEX_PATH: /data/kb-index.sqlite
      AUTH_DB_PATH: /data/auth.sqlite
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required}
      BETTER_AUTH_URL: ${PUBLIC_URL:?PUBLIC_URL required}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Módulo de cuestionarios /assess (B.1). Apagado salvo "true" explícito.
      ASSESSMENTS_ENABLED: ${ASSESSMENTS_ENABLED:-false}
      # Guía educativa y acotación de KB por marcador. Ambos quedan apagados
      # salvo activación explícita durante validaciones controladas.
      ASSISTANT_EDU_GUIDE: ${ASSISTANT_EDU_GUIDE:-false}
      KB_MARKER_SCOPE: ${KB_MARKER_SCOPE:-false}
      # Diagnóstico de retrieval: vuelca query y títulos de chunks al log.
      # Contiene datos de usuario — solo "true" en sesiones de depuración.
      RETRIEVAL_DEBUG: ${RETRIEVAL_DEBUG:-false}
      # Email transaccional (verificación + reset de contraseña) vía Brevo.
      BREVO_API_KEY: ${BREVO_API_KEY:?BREVO_API_KEY required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM required}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_URL}
      NODE_ENV: production
      XDG_CACHE_HOME: /data/.cache
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - vitamap_data:/data
    networks:
      - vitamap
    # Sin depends_on al servicio llm: con el perfil local-llm desactivado
    # (modo API externa, ADR-014) el servicio no existe y un depends_on
    # duro rompería el `up`. En modo local, las primeras peticiones
    # durante el arranque del LLM fallan con error claro y reintento.

  llm:
    # Solo se levanta con COMPOSE_PROFILES=local-llm (modo por defecto
    # recomendado, ver .env.example). En modo API externa queda apagado
    # y libera ~5 GB de RAM y 3 vCPU del CCX13.
    profiles: ["local-llm"]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    # El modelo se descarga con infra/scripts/download-model.sh ANTES de
    # levantar el stack. Queda en el volumen llm_models montado en /models.
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/${LLM_MODEL_FILE:-qwen3-4b-instruct-q4_k_m.gguf}"
      - "--ctx-size"
      - "8192"
      - "--threads"
      # 3 de las 4 vCPU del CCX13 para el LLM; 1 queda para Next/Caddy.
      - "${LLM_THREADS:-3}"
      - "--n-gpu-layers"
      - "0"
      # Dos slots: generación y guardrail usan system prompts distintos;
      # con un solo slot se pisarían la caché KV mutuamente. Cada slot
      # recibe ctx-size/parallel = 4096 tokens, suficiente para el budget
      # actual (system ~1.5k + contexto RAG + historial + <=350 de salida).
      - "--parallel"
      - "2"
      # Reutiliza fragmentos de caché KV con prefijo común >=256 tokens
      # (requiere cache_prompt:true en la petición — ver lib/llm.ts).
      - "--cache-reuse"
      - "256"
      - "--reasoning"
      - "off"
      - "--alias"
      - "${LLM_MODEL:-qwen3-4b-instruct}"
    volumes:
      - llm_models:/models
    networks:
      - vitamap
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  backup:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backup
    image: vitamap/backup:latest
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?RESTIC_REPOSITORY required}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD required}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
      BACKUP_TARGET: /data
      RETENTION_KEEP_DAILY: "7"
      RETENTION_KEEP_WEEKLY: "4"
      RETENTION_KEEP_MONTHLY: "6"
    volumes:
      - vitamap_data:/data:ro
    networks:
      - vitamap

  admin:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      target: admin
    image: vitamap/admin:latest
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-qwen3-4b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed-for-local}
      QMD_EMBED_MODEL: ${QMD_EMBED_MODEL:-hf:Qwen/Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf}
      DATA_ROOT: /data
      KB_INDEX_PATH: /data/kb-index.sqlite
      AUTH_DB_PATH: /data/auth.sqlite
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required}
      BETTER_AUTH_URL: ${PUBLIC_URL:?PUBLIC_URL required}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_URL}
      NODE_ENV: production
      XDG_CACHE_HOME: /data/.cache
    volumes:
      - vitamap_data:/data
    networks:
      - vitamap

networks:
  vitamap:
    driver: bridge

volumes:
  vitamap_data:
    # Persistencia principal. En el host vive en /var/lib/docker/volumes/
    # vitamap_vitamap_data por defecto. Encima ya hay LUKS a nivel disco.
  llm_models:
    # Modelos GGUF, descargados antes del primer up.
  caddy_data:
  caddy_config:
