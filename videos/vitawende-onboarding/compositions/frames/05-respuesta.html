<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Hanken+Grotesk:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap");

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Hanken Grotesk", system-ui, sans-serif;
          color: #c0e0e0;
          background: #020b22;
        }
        .bg {
          position: absolute;
          inset: 0;
          background-color: #020b22;
          background-image:
            radial-gradient(ellipse 60% 60% at 42% 44%, rgba(21, 68, 84, 0.2), transparent 66%),
            linear-gradient(rgba(32, 192, 224, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(32, 192, 224, 0.05) 1px, transparent 1px);
          background-size: 100% 100%, 48px 48px, 48px 48px;
          z-index: 0;
        }
        #root > *:not(.bg) { z-index: 2; }
        .hair { position: absolute; left: 80px; right: 80px; height: 2px; background: linear-gradient(to right, transparent, rgba(83, 222, 238, 0.3) 14%, rgba(83, 222, 238, 0.08) 42%, rgba(83, 222, 238, 0.24) 72%, transparent); transform-origin: left center; }
        .hair-top { top: 70px; }
        .hair-bot { bottom: 66px; }
        .chrome-l { position: absolute; top: 106px; left: 96px; font-family: "DM Mono", ui-monospace, monospace; font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(129, 149, 168, 0.62); }
        .chrome-l b { color: #c0e0e0; font-weight: 500; }
        .chrome-r { position: absolute; top: 106px; right: 96px; font-family: "DM Mono", ui-monospace, monospace; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(224, 192, 64, 0.7); }

        .bubble-user {
          position: absolute;
          top: 172px;
          right: 150px;
          max-width: 820px;
          background: #c0e0e0;
          color: #020b22;
          padding: 16px 24px;
          border-radius: 20px 20px 6px 20px;
          font-size: 23px;
          line-height: 1.3;
        }

        .answer {
          position: absolute;
          top: 300px;
          left: 150px;
          width: 1240px;
          background: #0a1427;
          border: 1px solid #1f3a52;
          border-radius: 22px 22px 22px 6px;
          padding: 40px 46px 34px;
        }
        .a-line { font-family: "Newsreader", Georgia, serif; font-size: 41px; line-height: 1.28; color: rgba(229, 238, 238, 0.96); }
        .a-line + .a-line { margin-top: 8px; }
        .a-em { color: #20c0e0; }
        .disclaimer {
          margin-top: 26px;
          display: inline-flex;
          align-items: center;
          gap: 12px;
          font-family: "DM Mono", ui-monospace, monospace;
          font-size: 20px;
          letter-spacing: 0.04em;
          color: #e0c040;
        }
        .disclaimer::before { content: ""; width: 12px; height: 12px; border: 2px solid #e0c040; border-radius: 50%; }

        .sources { position: absolute; top: 720px; left: 150px; display: flex; align-items: center; gap: 16px; }
        .src-label { font-family: "Hanken Grotesk"; font-size: 20px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8195a8; }
        .chip { border: 1px solid #1f3a52; background: rgba(10, 20, 39, 0.8); padding: 12px 22px; display: flex; align-items: center; gap: 10px; font-size: 22px; color: #c0e0e0; }
        .chip .tag { font-family: "DM Mono", ui-monospace, monospace; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; color: #20c0e0; }
        .chip.evidence .tag { color: #e0c040; }
        .pagenum { position: absolute; right: 96px; bottom: 30px; font-family: "DM Mono", ui-monospace, monospace; font-size: 16px; letter-spacing: 0.2em; color: rgba(129, 149, 168, 0.4); }
      </style>

      <div id="root" data-composition-id="05-respuesta" data-width="1920" data-height="1080" data-duration="5">
        <div class="bg clip" data-start="0" data-duration="5" data-track-index="0"></div>
        <div class="hair hair-top"></div>
        <div class="hair hair-bot"></div>
        <div class="chrome-l">VitaMap · <b>Chat</b></div>
        <div class="chrome-r">05 · Antwort</div>

        <div class="bubble-user">Gibt es in meinen Blutwerten Hinweise, die meinen Schlaf beeinflussen könnten?</div>

        <div class="answer">
          <div class="a-line">Einige <span class="a-em">Laborwerte</span> können Hinweise auf</div>
          <div class="a-line">Faktoren geben, die Schlaf und Erholung beeinflussen.</div>
          <div class="a-line">VitaMap markiert relevante Werte und passende Fragen.</div>
          <div class="disclaimer">Zur Orientierung · keine ärztliche Beratung</div>
        </div>

        <div class="sources" data-layout-allow-occlusion>
          <span class="src-label">Quellen (3)</span>
          <span class="chip personal"><span class="tag">Daten</span> blutbild-2026</span>
          <span class="chip personal"><span class="tag">Daten</span> schilddruese</span>
          <span class="chip evidence"><span class="tag">Evidenz</span> schlafleitlinie</span>
        </div>

        <div class="pagenum">05 / 06</div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var S = '[data-composition-id="05-respuesta"] ';
          var tl = gsap.timeline({ paused: true });

          tl.fromTo(S + ".bg", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
          tl.fromTo(S + ".hair", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out", stagger: 0.08 }, 0);
          tl.fromTo([S + ".chrome-l", S + ".chrome-r"], { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.08 }, 0.2);
          tl.fromTo(S + ".bubble-user", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.4);

          tl.fromTo(S + ".answer", { opacity: 0, y: 26, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.8);
          tl.fromTo(S + ".a-line", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.4 }, 1.2);
          tl.fromTo(S + ".disclaimer", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.0);

          tl.fromTo(S + ".src-label", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 3.0);
          tl.fromTo(S + ".chip", { opacity: 0, y: 18, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.16 }, 3.15);
          tl.fromTo(S + ".pagenum", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);

          window.__timelines["05-respuesta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
