<!doctype html>

    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Hanken+Grotesk:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap");

        #root {

        .vignette {

        .ring {

          top: 50%;
          left: 50%;

        .seed {
          position: absolute;
          top: 15%;
          left: 15%;
          width: 70%;
          height: 70%;

          filter: drop-shadow(0 0 16px rgba(255, 150, 70, 0.4));

        .seed-face { fill: rgba(38, 17, 8, 0.9); stroke: rgba(255, 196, 124, 0.86); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 6.5; }

        .orb-glass {

          inset: 0;
          border-radius: inherit;
          background: linear-gradient(116deg, rgba(255, 255, 255, 0.08), transparent 34%), radial-gradient(ellipse 50% 30% at 58% 18%, rgba(255, 255, 255, 0.05), transparent 70%);

        .readout {

          font-family: "DM Mono", ui-monospace, monospace;
        }
        .readout-title { display: block; margin-bottom: 16px; font-size: 18px; font-weight: 500; letter-spacing: 0.3em; color: rgba(83, 222, 238, 0.66); }
        .readout .rrow { display: flex; justify-content: space-between; gap: 24px; font-size: 19px; padding: 4px 0; }
        .readout dt { color: rgba(160, 177, 190, 0.6); }
        .readout dd { color: #e0c040; }
        .pagenum { position: absolute; right: 96px; bottom: 30px; font-family: "DM Mono", ui-monospace, monospace; font-size: 16px; letter-spacing: 0.2em; color: rgba(129, 149, 168, 0.4); }

      <script>

          window.__timelines = window.__timelines || {};
          var S = '[data-composition-id="01-inicio"] ';

          tl.fromTo(S + ".bg", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo(S + ".hair", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.9, ease: "power2.out", stagger: 0.1 }, 0.2);
