<!doctype html>
<html lang="de">
  <head>

  <body>
    <template>
      <style>

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Hanken Grotesk", system-ui, sans-serif;
          color: #c0e0e0;
          background: #020b22;
          text-align: center;
        }
        .bg {
          position: absolute;
          inset: 0;
          background-color: #020b22;
          background-image:
            radial-gradient(ellipse 66% 60% at 50% 46%, rgba(21, 68, 84, 0.34), transparent 60%),
            linear-gradient(rgba(32, 192, 224, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(32, 192, 224, 0.05) 1px, transparent 1px);
          background-size: 100% 100%, 48px 48px, 48px 48px;
        }
        .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 92% 76% at 50% 48%, transparent 42%, rgba(0, 2, 12, 0.55) 82%, rgba(0, 0, 4, 0.9) 100%); pointer-events: none; }
        .hair { position: absolute; left: 80px; right: 80px; height: 2px; background: linear-gradient(to right, transparent, rgba(83, 222, 238, 0.3) 20%, rgba(83, 222, 238, 0.1) 50%, rgba(83, 222, 238, 0.28) 80%, transparent); transform-origin: center center; }
        .hair-top { top: 70px; }
        .hair-bot { bottom: 66px; }

        .center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1200px; }
        .kicker { font-family: "DM Mono", ui-monospace, monospace; font-size: 24px; font-weight: 500; letter-spacing: 0.4em; text-transform: uppercase; color: rgba(129, 149, 168, 0.7); }
        .mark { margin-top: 24px; font-family: "Newsreader", Georgia, serif; font-size: 176px; font-weight: 400; line-height: 0.94; letter-spacing: -0.01em; color: rgba(229, 238, 238, 0.97); }
        .tagline { margin-top: 26px; font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: 46px; color: rgba(32, 192, 224, 0.85); }
        .rule { margin: 34px auto 0; width: 160px; height: 2px; background: rgba(83, 222, 238, 0.5); transform-origin: center center; }
        .cta { margin-top: 30px; font-family: "Hanken Grotesk"; font-size: 24px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #e0c040; }
        .pagenum { position: absolute; right: 96px; bottom: 30px; font-family: "DM Mono", ui-monospace, monospace; font-size: 16px; letter-spacing: 0.2em; color: rgba(129, 149, 168, 0.4); }
      </style>

      <div id="root" data-composition-id="06-cierre" data-width="1920" data-height="1080" data-duration="3">
        <div class="bg clip" data-start="0" data-duration="3" data-track-index="0"></div>
        <div class="hair hair-top"></div>
        <div class="hair hair-bot"></div>
        <div class="vignette"></div>

        <div class="center">

        </div>

        <div class="pagenum">06 / 06</div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var S = '[data-composition-id="06-cierre"] ';
          var tl = gsap.timeline({ paused: true });

          tl.fromTo(S + ".bg", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
          tl.fromTo([S + ".hair-top", S + ".hair-bot"], { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 0.1);
          tl.fromTo(S + ".kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.3);
          tl.fromTo(S + ".mark", { opacity: 0, y: 24, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" }, 0.55);
          tl.fromTo(S + ".tagline", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.15);
          tl.fromTo(S + ".rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 1.5);
          tl.fromTo(S + ".cta", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.8);
          tl.fromTo(S + ".pagenum", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.6);

          window.__timelines["06-cierre"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
