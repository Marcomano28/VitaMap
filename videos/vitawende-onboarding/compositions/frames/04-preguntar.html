<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400&family=Hanken+Grotesk:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap");

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Hanken Grotesk", system-ui, sans-serif;
          color: #c0e0e0;
          background: #020b22;
        }
        .bg {
          position: absolute;
          inset: 0;
          background-color: #020b22;
          background-image:
            radial-gradient(ellipse 60% 60% at 55% 42%, rgba(21, 68, 84, 0.2), transparent 66%),
            linear-gradient(rgba(32, 192, 224, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(32, 192, 224, 0.05) 1px, transparent 1px);
          background-size: 100% 100%, 48px 48px, 48px 48px;
        }
        .hair { position: absolute; left: 80px; right: 80px; height: 2px; background: linear-gradient(to right, transparent, rgba(83, 222, 238, 0.3) 14%, rgba(83, 222, 238, 0.08) 42%, rgba(83, 222, 238, 0.24) 72%, transparent); transform-origin: left center; }
        .hair-top { top: 70px; }
        .hair-bot { bottom: 66px; }
        .chrome-l { position: absolute; top: 106px; left: 96px; font-family: "DM Mono", ui-monospace, monospace; font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(129, 149, 168, 0.62); }
        .chrome-l b { color: #c0e0e0; font-weight: 500; }
        .chrome-r { position: absolute; top: 106px; right: 96px; font-family: "DM Mono", ui-monospace, monospace; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(224, 192, 64, 0.7); }

        .window {
          position: absolute;
          top: 170px;
          left: 50%;
          margin-left: -540px;
          width: 1080px;
          height: 720px;
          background: linear-gradient(180deg, #0b1730, #0a1427);
          border: 1px solid #1f3a52;
          box-shadow: 0 0 70px rgba(2, 8, 24, 0.7);
          display: flex;
          flex-direction: column;
        }
        .wtitle { padding: 22px 30px; border-bottom: 1px solid #1f3a52; font-family: "Newsreader", Georgia, serif; font-size: 34px; color: rgba(229, 238, 238, 0.95); }
        .wtitle span { font-family: "DM Mono", ui-monospace, monospace; font-size: 18px; letter-spacing: 0.2em; text-transform: uppercase; color: #8195a8; margin-left: 14px; }
        .stream { flex: 1; padding: 34px 34px; position: relative; }

        .bubble-user {
          position: absolute;
          top: 60px;
          right: 34px;
          max-width: 800px;
          background: #c0e0e0;
          color: #020b22;
          padding: 20px 26px;
          border-radius: 22px 22px 6px 22px;
          font-size: 27px;
          line-height: 1.35;
        }
        .thinking {
          position: absolute;
          left: 34px;
          top: 190px;
          display: flex;
          align-items: center;
          gap: 14px;
          font-size: 24px;
          color: #8195a8;
        }
        .tdot { width: 14px; height: 14px; border-radius: 50%; background: #20c0e0; }
        .tdots { display: flex; gap: 8px; }

        .inputbar { border-top: 1px solid #1f3a52; padding: 22px 30px; display: flex; align-items: center; gap: 18px; }
        .inputbox { flex: 1; height: 64px; border: 1px solid #1f3a52; background: #020b22; display: flex; align-items: center; padding: 0 22px; font-size: 22px; color: #8195a8; }
        .inputbox .caret { display: inline-block; width: 3px; height: 26px; background: #20c0e0; margin-left: 2px; }
        .sendbtn { height: 64px; padding: 0 34px; background: #c0e0e0; color: #020b22; display: flex; align-items: center; font-size: 22px; font-weight: 700; }
        .pagenum { position: absolute; right: 96px; bottom: 30px; font-family: "DM Mono", ui-monospace, monospace; font-size: 16px; letter-spacing: 0.2em; color: rgba(129, 149, 168, 0.4); }
      </style>

      <div id="root" data-composition-id="04-preguntar" data-width="1920" data-height="1080" data-duration="3.5">
        <div class="bg clip" data-start="0" data-duration="3.5" data-track-index="0"></div>
        <div class="hair hair-top"></div>
        <div class="hair hair-bot"></div>
        <div class="chrome-l">VitaMap · <b>Chat</b></div>
        <div class="chrome-r">04 · Frage</div>

        <div class="window">
          <div class="wtitle">Gespräch<span>Mit deinen Daten</span></div>
          <div class="stream">
            <div class="bubble-user">Gibt es in meinen Blutwerten Hinweise, die meinen Schlaf beeinflussen könnten?</div>
            <div class="thinking">
              <span class="tdots"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span></span>
              <span>wird eingeordnet...</span>
            </div>
          </div>
          <div class="inputbar">
            <div class="inputbox"><span>Schreibe deine Frage...</span><span class="caret"></span></div>
            <div class="sendbtn">Senden</div>
          </div>
        </div>

        <div class="pagenum">04 / 06</div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var S = '[data-composition-id="04-preguntar"] ';
          var tl = gsap.timeline({ paused: true });

          tl.fromTo(S + ".bg", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
          tl.fromTo(S + ".hair", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out", stagger: 0.08 }, 0);
          tl.fromTo([S + ".chrome-l", S + ".chrome-r"], { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.08 }, 0.2);
          tl.fromTo(S + ".window", { opacity: 0, scale: 0.96, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
          tl.fromTo(S + ".wtitle", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.7);
          tl.fromTo(S + ".inputbar", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.8);

          // user message rises from the input area into the stream
          tl.fromTo(S + ".bubble-user", { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 1.3);
          // assistant "thinking" dots appear in a stagger
          tl.fromTo(S + ".thinking", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.1);
          tl.fromTo(S + ".tdot", { opacity: 0.2, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out", stagger: 0.18 }, 2.2);
          tl.fromTo(S + ".pagenum", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);

          window.__timelines["04-preguntar"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
