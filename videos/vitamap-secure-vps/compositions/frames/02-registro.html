<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Hanken+Grotesk:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap");

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Hanken Grotesk", system-ui, sans-serif;
          color: #c0e0e0;
          background: #020b22;
        }
        .bg {
          position: absolute;
          inset: 0;
          background-color: #020b22;
          background-image:
            radial-gradient(ellipse 60% 60% at 50% 40%, rgba(21, 68, 84, 0.22), transparent 66%),
            linear-gradient(rgba(32, 192, 224, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(32, 192, 224, 0.05) 1px, transparent 1px);
          background-size: 100% 100%, 48px 48px, 48px 48px;
        }
        .hair { position: absolute; left: 80px; right: 80px; height: 2px; background: linear-gradient(to right, transparent, rgba(83, 222, 238, 0.3) 14%, rgba(83, 222, 238, 0.08) 42%, rgba(83, 222, 238, 0.24) 72%, transparent); transform-origin: left center; }
        .hair-top { top: 70px; }
        .hair-bot { bottom: 66px; }
        .chrome-l { position: absolute; top: 106px; left: 96px; font-family: "DM Mono", ui-monospace, monospace; font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(129, 149, 168, 0.62); }
        .chrome-l b { color: #c0e0e0; font-weight: 500; }
        .chrome-r { position: absolute; top: 106px; right: 96px; font-family: "DM Mono", ui-monospace, monospace; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(224, 192, 64, 0.7); }

        .card {
          position: absolute;
          top: 150px;
          left: 50%;
          margin-left: -430px;
          width: 860px;
          padding: 48px 56px 52px;
          background: linear-gradient(180deg, #0b1730, #0a1427);
          border: 1px solid #1f3a52;
          box-shadow: 0 0 70px rgba(2, 8, 24, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }
        .card-title { font-family: "Newsreader", Georgia, serif; font-size: 58px; font-weight: 400; line-height: 1.0; color: rgba(229, 238, 238, 0.96); }
        .card-intro { margin-top: 16px; font-size: 22px; line-height: 1.4; color: #8195a8; max-width: 720px; }
        .card-intro b { color: #20c0e0; font-weight: 600; }

        .field { margin-top: 26px; }
        .flabel { font-family: "Hanken Grotesk", system-ui, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #8195a8; }
        .input { margin-top: 9px; height: 58px; border: 1px solid #1f3a52; background: #020b22; display: flex; align-items: center; padding: 0 20px; font-size: 24px; color: #c0e0e0; }
        .input .val { white-space: nowrap; overflow: hidden; }
        .row2 { display: flex; gap: 22px; }
        .row2 .field { flex: 1; }

        .consents { margin-top: 30px; border: 1px solid #1f3a52; padding: 18px 22px; }
        .clegend { font-family: "Hanken Grotesk"; font-size: 15px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #8195a8; }
        .cline { display: flex; align-items: flex-start; gap: 14px; margin-top: 14px; font-size: 20px; line-height: 1.35; color: #c0e0e0; }
        .checkbox { flex: 0 0 auto; width: 30px; height: 30px; border: 1px solid #20c0e0; display: grid; place-items: center; margin-top: 2px; }
        .checkmark { color: #20c0e0; font-size: 24px; line-height: 1; }

        .submit { margin-top: 30px; height: 66px; background: #c0e0e0; color: #020b22; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
        .caret { display: inline-block; width: 3px; height: 26px; background: #20c0e0; margin-left: 3px; vertical-align: middle; }
        .pagenum { position: absolute; right: 96px; bottom: 30px; font-family: "DM Mono", ui-monospace, monospace; font-size: 16px; letter-spacing: 0.2em; color: rgba(129, 149, 168, 0.4); }
      </style>

      <div id="root" data-composition-id="02-registro" data-width="1920" data-height="1080" data-duration="6">
        <div class="bg clip" data-start="0" data-duration="6" data-track-index="0"></div>
        <div class="hair hair-top"></div>
        <div class="hair hair-bot"></div>
        <div class="chrome-l">VitaMap · <b>Zugang</b></div>
        <div class="chrome-r">02 · Zugang</div>

        <div class="card">
          <div class="card-title">Konto erstellen</div>
          <div class="card-intro">VitaMap läuft in einer <b>geschützten VPS-Umgebung</b>. Deine Einwilligung bleibt bewusst und transparent.</div>

          <div class="field">
            <div class="flabel">Name</div>
            <div class="input"><span class="val" data-field="inv">Maria</span></div>
          </div>
          <div class="field">
            <div class="flabel">E-Mail</div>
            <div class="input"><span class="val" data-field="email">maria@beispiel.de</span></div>
          </div>
          <div class="row2">
            <div class="field">
              <div class="flabel">Passwort · mind. 10</div>
              <div class="input"><span class="val" data-field="pw">••••••••••••</span></div>
            </div>
            <div class="field">
              <div class="flabel">Passwort wiederholen</div>
              <div class="input"><span class="val" data-field="pw2">••••••••••••</span></div>
            </div>
          </div>

          <div class="consents">
            <div class="clegend">Zustimmung & Schutz</div>
            <div class="cline"><span class="checkbox"><span class="checkmark">&#10003;</span></span><span>DSGVO-konforme Verarbeitung sensibler Gesundheitsdaten.</span></div>
            <div class="cline"><span class="checkbox"><span class="checkmark">&#10003;</span></span><span>Modell und Daten bleiben in der kontrollierten VPS-Umgebung.</span></div>
          </div>

          <div class="submit">Konto sicher erstellen</div>
        </div>

        <div class="pagenum">02 / 06</div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var S = '[data-composition-id="02-registro"] ';
          var tl = gsap.timeline({ paused: true });

          tl.fromTo(S + ".bg", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
          tl.fromTo(S + ".hair", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out", stagger: 0.08 }, 0);
          tl.fromTo([S + ".chrome-l", S + ".chrome-r"], { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.08 }, 0.2);
          tl.fromTo(S + ".card", { opacity: 0, scale: 0.94, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.25);
          tl.fromTo([S + ".card-title", S + ".card-intro"], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.12 }, 0.6);

          // fields "type" in — reveal each value by growing its clip width
          tl.fromTo(S + ".field", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.16 }, 0.9);
          tl.fromTo(S + '[data-field="inv"]', { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "none" }, 1.15);
          tl.fromTo(S + '[data-field="email"]', { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "none" }, 1.55);
          tl.fromTo(S + '[data-field="pw"]', { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "none" }, 1.95);
          tl.fromTo(S + '[data-field="pw2"]', { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "none" }, 2.2);

          tl.fromTo(S + ".consents", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.35);
          tl.fromTo(S + ".checkmark", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)", stagger: 0.22 }, 2.7);
          tl.fromTo(S + ".submit", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.25);
          tl.fromTo(S + ".pagenum", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);

          window.__timelines["02-registro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
