<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400&family=Hanken+Grotesk:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap");

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Hanken Grotesk", system-ui, sans-serif;
          color: #c0e0e0;
          background: #020b22;
        }
        .bg {
          position: absolute;
          inset: 0;
          background-color: #020b22;
          background-image:
            radial-gradient(ellipse 62% 60% at 40% 40%, rgba(21, 68, 84, 0.22), transparent 66%),
            linear-gradient(rgba(32, 192, 224, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(32, 192, 224, 0.05) 1px, transparent 1px);
          background-size: 100% 100%, 48px 48px, 48px 48px;
        }
        .hair { position: absolute; left: 80px; right: 80px; height: 2px; background: linear-gradient(to right, transparent, rgba(83, 222, 238, 0.3) 14%, rgba(83, 222, 238, 0.08) 42%, rgba(83, 222, 238, 0.24) 72%, transparent); transform-origin: left center; }
        .hair-top { top: 70px; }
        .hair-bot { bottom: 66px; }
        .chrome-l { position: absolute; top: 106px; left: 96px; font-family: "DM Mono", ui-monospace, monospace; font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(129, 149, 168, 0.62); }
        .chrome-l b { color: #c0e0e0; font-weight: 500; }
        .chrome-r { position: absolute; top: 106px; right: 96px; font-family: "DM Mono", ui-monospace, monospace; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(224, 192, 64, 0.7); }

        .heading { position: absolute; top: 172px; left: 150px; font-family: "Newsreader", Georgia, serif; font-size: 74px; line-height: 1; color: rgba(229, 238, 238, 0.96); }
        .subhead { position: absolute; top: 268px; left: 152px; font-size: 24px; color: #8195a8; }

        .dropzone {
          position: absolute;
          top: 350px;
          left: 150px;
          width: 900px;
          height: 300px;
          border: 2px dashed #20c0e0;
          background: rgba(10, 20, 39, 0.5);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
        }
        .dz-icon { width: 76px; height: 76px; border: 2px solid rgba(32, 192, 224, 0.55); position: relative; margin-bottom: 8px; }
        .dz-icon::before { content: ""; position: absolute; top: 16px; left: 16px; right: 16px; height: 2px; background: rgba(32, 192, 224, 0.5); box-shadow: 0 12px 0 rgba(32, 192, 224, 0.5), 0 24px 0 rgba(32, 192, 224, 0.35); }
        .dz-main { font-size: 30px; font-weight: 600; color: #c0e0e0; }
        .dz-sub { font-size: 20px; color: #8195a8; }

        .files { position: absolute; top: 350px; left: 1090px; width: 680px; display: flex; flex-direction: column; gap: 16px; }
        .frow { border: 1px solid #1f3a52; background: #0a1427; padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .fname { font-size: 22px; color: #c0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fstatus { font-family: "DM Mono", ui-monospace, monospace; font-size: 18px; white-space: nowrap; }
        .st-up { color: #8195a8; }
        .st-ok { color: #7fd0a0; }
        .st-queue { color: #8195a8; }
        .pbar { position: relative; margin-top: 4px; height: 6px; background: #1f3a52; }
        .pfill { position: absolute; inset: 0 auto 0 0; width: 100%; background: #20c0e0; transform-origin: left center; }
        .doc {
          position: absolute; top: 372px; left: 486px; width: 96px; height: 122px;
          background: #0a1427; border: 2px solid #20c0e0;
        }
        .doc::before { content: ""; position: absolute; top: 20px; left: 16px; right: 16px; height: 2px; background: rgba(32,192,224,0.55); box-shadow: 0 16px 0 rgba(32,192,224,0.45), 0 32px 0 rgba(32,192,224,0.45), 0 48px 0 rgba(32,192,224,0.3); }
        .pagenum { position: absolute; right: 96px; bottom: 30px; font-family: "DM Mono", ui-monospace, monospace; font-size: 16px; letter-spacing: 0.2em; color: rgba(129, 149, 168, 0.4); }
      </style>

      <div id="root" data-composition-id="03-subir-datos" data-width="1920" data-height="1080" data-duration="5">
        <div class="bg clip" data-start="0" data-duration="5" data-track-index="0"></div>
        <div class="hair hair-top"></div>
        <div class="hair hair-bot"></div>
        <div class="chrome-l">VitaMap · <b>Daten hochladen</b></div>
        <div class="chrome-r">03 · Daten</div>

        <div class="heading">Daten hochladen</div>
        <div class="subhead">Laborwerte und Befunde bleiben in deiner kontrollierten Umgebung.</div>

        <div class="dropzone">
          <div class="dz-icon"></div>
          <div class="dz-main">PDFs oder Bilder hier ablegen</div>
          <div class="dz-sub">verschlüsselt speichern und danach prüfen</div>
        </div>

        <div class="doc"></div>

        <div class="files">
          <div class="frow" data-row="1">
            <div>
              <div class="fname">blutbild-2026.pdf</div>
              <div class="pbar"><div class="pfill"></div></div>
            </div>
            <div class="fstatus st-up">Wird hochgeladen...</div>
          </div>
          <div class="frow" data-row="2">
            <div class="fname">schilddruese-befund.pdf</div>
            <div class="fstatus st-ok">Bereit für OCR</div>
          </div>
          <div class="frow" data-row="3">
            <div class="fname">vitamin-d-labor.jpg</div>
            <div class="fstatus st-queue">In Warteschlange</div>
          </div>
        </div>

        <div class="pagenum">03 / 06</div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var S = '[data-composition-id="03-subir-datos"] ';
          var tl = gsap.timeline({ paused: true });

          tl.fromTo(S + ".bg", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
          tl.fromTo(S + ".hair", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out", stagger: 0.08 }, 0);
          tl.fromTo([S + ".chrome-l", S + ".chrome-r"], { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.08 }, 0.2);
          tl.fromTo([S + ".heading", S + ".subhead"], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.12 }, 0.4);
          tl.fromTo(S + ".dropzone", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 0.7);

          // a document glides in and drops into the zone
          tl.fromTo(S + ".doc", { opacity: 0, x: 220, y: -60 }, { opacity: 1, x: 0, y: 0, duration: 0.8, ease: "power2.in" }, 1.1);
          tl.fromTo(S + ".doc", { scale: 1 }, { scale: 0.6, opacity: 0, duration: 0.3, ease: "power1.in" }, 1.9);

          // file rows populate one by one
          tl.fromTo(S + '.frow[data-row="1"]', { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 1.95);
          tl.fromTo(S + ".pfill", { scaleX: 0.05 }, { scaleX: 0.72, duration: 1.1, ease: "power1.out" }, 2.15);
          tl.fromTo(S + '.frow[data-row="2"]', { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 2.4);
          tl.fromTo(S + '.frow[data-row="3"]', { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 2.8);
          tl.fromTo(S + ".pagenum", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);

          window.__timelines["03-subir-datos"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
