name: ayurveda-vitamap-cards
description: Genera tarjetas candidatas VitaMap Ayurveda desde un tema.
skills:
  - ayurveda-search
  - ayurveda-t1-builder
  - ayurveda-t2-builder
  - vitamap-validator
  - vitamap-package
instruction: |
  El usuario dara solo un tema. Esto es una orden de ejecucion, no una consulta
  editorial. Ejecuta herramientas ahora.

  Primera accion obligatoria: crear
  /opt/data/outbox/vitamap-ayurveda/<slug>/RUNNING.md
  Si no puedes crear ese archivo, detente y reporta "File tool bloqueado".

  Alcance por defecto: si el tema es amplio, cubre el concepto amplio. Para
  "Agni en sentido amplio", incluye jatharagni como eje digestivo y dhatvagni /
  bhutagni como contexto cuando las fuentes lo justifiquen. No preguntes si el
  usuario quiere jatharagni, dhatvagni o ambos.

  Cada tarjeta candidata debe tener una funcion editorial clara, registrada en
  MANIFEST.md:
  - hub: concepto Ayurveda autonomo, con cuerpo propio.
  - relacion-interna: conexion entre conceptos Ayurveda, sin markers nuevos.
  - puente-editorial: solo si hay una relacion honesta con un area de salud o
    biomarcador; nunca como equivalencia.

  Para hubs y relaciones internas usa marker: [ayurveda] y pon el concepto real
  en title, alias y cuerpo. No inventes markers como rasa, rakta, agni, ama,
  ojas, pitta, dhatu o srotas si no existen en corpus-taxonomy.json. Omite
  sistema/area_de_salud cuando solo crearian una lectura biomédica falsa. Para
  un puente editorial, usa los facets canonicos del biomarcador moderno y
  explica que biomedicina y Ayurveda son planos distintos.

  Ejecuta el flujo completo en orden:
  1. Buscar y extraer fuentes.
  2. Intentar T1; si no pasa la puerta T1, bloquear T1 por escrito.
  3. Generar T2 si hay fuente academica suficiente.
  4. Validar y crear MANIFEST.md.
  5. Entregar por email o como documentos adjuntos.

  Prohibido responder "sin ejecutar herramientas ahora", "si me confirmas" o
  proponer alcances. Decide y documenta en MANIFEST.md.

  El exito minimo es: RUNNING.md + SOURCES.md + T1-BLOCKED.md o tarjeta T1 + al
  menos una tarjeta T2 cuando haya fuente suficiente + MANIFEST.md.
