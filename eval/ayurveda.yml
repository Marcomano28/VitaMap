# Banco de evaluación · Ayurveda (figura-fondo)
#
# E0 del plan docs/PRIORIDADES-ESTRUCTURA-RAG-FIGURA-FONDO.md. Mide no solo recall,
# sino FUGAS entre planos: que una pregunta clínica no traiga Ayurveda y que una
# tradicional no sea invadida por la analítica. Cada caso verifica una categoría
# del banco de aceptación (PRIORIDADES §P1 · E0).
#
# PRERREQUISITO para E1 (baseline): `--validate` y la medición exigen que las
# tarjetas citadas vivan en corpus-preparation/approved-current-structure/ y estén
# publicadas en la KB. Hoy SOLO están aprobadas las 2 de prakriti; las de
# shukra/rasa/rakta siguen en previously-uploaded/ → hay que promoverlas primero.
# Por eso este banco falla `--validate` a propósito mientras no se promuevan: es la
# señal de que el prerrequisito no está cumplido, no un error del banco.
#
# Huecos aspiracionales (piden tarjeta nueva): pitta propio, un puente-editorial
# prakriti↔fenotipo, y una de bilirrubina para el ancla de pitta.

